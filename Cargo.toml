[workspace]
members = ["crates/cq-core", "crates/cq-capture-protocol", "crates/cq-rustc-recorder", "crates/cq-store", "crates/cq-app", "crates/cq-clang"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
libc = "0.2"
cargo_metadata = "0.23"
tempfile = "3"
regex = "1"
rayon = "1.12"
pulldown-cmark = "0.13"
lbug = "=0.22.3"
cq-capture-protocol = { path = "crates/cq-capture-protocol" }
cq-core = { path = "crates/cq-core" }
cq-store = { path = "crates/cq-store" }
